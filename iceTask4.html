<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--Meta tags for SEO -->
    <meta name="description" content="An exciting South African web-based arcade game where players test their skills and compete for the top score.">
    <meta name="keywords" content="South Africa, web game, arcade, browser game, WEDE5020, JavaScript game">
    
    <title>Proudly South African Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Heading & CSS Flag Section -->
    <header class="header-banner">
        <h3>This game is proudly South African.</h3>
        
        <div class="flag-container" aria-label="South African Flag">
            <div class="flag-red"></div>
            <div class="flag-blue"></div>
            <div class="flag-white-y"></div>
            <div class="flag-green-y"></div>
            <div class="flag-yellow-v"></div>
            <div class="flag-black-triangle"></div>
        </div>
    </header>

    <main>
        <section class="game-container">
            <h1>Welcome!</h1>
        </section>
    </main>

</body>
</html>
